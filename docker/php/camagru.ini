; Camagru — configuration PHP
; Les erreurs vont dans les logs (docker logs), jamais affichées au client.
display_errors = Off
log_errors = On
error_reporting = E_ALL
expose_php = Off

; Limites d'upload (captures / uploads d'images de l'éditeur)
upload_max_filesize = 12M
post_max_size = 14M

; Session
session.name = CAMAGRU_SESSION
session.cookie_httponly = 1
session.use_strict_mode = 1

date.timezone = UTC
