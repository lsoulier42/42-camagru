name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint PHP & JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP (php -l)
        run: |
          set -e
          find src public scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l phpstan-bootstrap.php

      - name: Lint JavaScript (node --check)
        run: |
          set -e
          for f in public/assets/js/*.js; do node --check "$f"; done

      - name: Aucun fichier sensible committé
        run: |
          test ! -f .env
          test ! -d docker-data
          git ls-files public/uploads | grep -q . && exit 1 || true

  build:
    name: Build & smoke-test (Docker)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Configurer l'environnement
        run: cp .env.example .env

      - name: Construire la stack
        run: docker compose up -d --build

      - name: Attendre que le site réponde
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/ >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "Le site n'a pas répondu à temps" >&2
          exit 1

      - name: Smoke-test des pages publiques
        run: |
          curl -fsS http://localhost:8080/        | grep -q 'Camagru'
          curl -fsS http://localhost:8080/gallery | grep -q 'gallery'
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:8080/favicon.ico | grep -q '204'

  test:
    name: Analyse statique & tests (PHPStan + PHPUnit)
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: camagru
          MYSQL_USER: camagru
          MYSQL_PASSWORD: camagru
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Configurer PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, gd
          coverage: none

      - name: Installer les dépendances (dev uniquement)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPStan (niveau 6)
        run: vendor/bin/phpstan analyse --no-progress

      # Le bootstrap de tests crée la base camagru_test et applique le schéma.
      - name: PHPUnit (intégration MySQL)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: camagru
          DB_PASS: camagru
          DB_ROOT_PASS: root
        run: vendor/bin/phpunit
