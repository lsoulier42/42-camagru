name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint PHP & JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP (php -l)
        run: |
          set -e
          find src public scripts -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Lint JavaScript (node --check)
        run: |
          set -e
          for f in public/assets/js/*.js; do node --check "$f"; done

      - name: Aucun fichier sensible committé
        run: |
          test ! -f .env
          test ! -d docker-data
          git ls-files public/uploads | grep -q . && exit 1 || true

  build:
    name: Build & smoke-test (Docker)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Configurer l'environnement
        run: cp .env.example .env

      - name: Construire la stack
        run: docker compose up -d --build

      - name: Attendre que le site réponde
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/ >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "Le site n'a pas répondu à temps" >&2
          exit 1

      - name: Smoke-test des pages publiques
        run: |
          curl -fsS http://localhost:8080/        | grep -q 'Camagru'
          curl -fsS http://localhost:8080/gallery | grep -q 'gallery'
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:8080/favicon.ico | grep -q '204'
